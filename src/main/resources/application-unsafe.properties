spring.datasource.admin.username=admin
spring.datasource.admin.password=hacker

spring.datasource.application.username=application
spring.datasource.application.password=hacker

# H2 Console disabled — exposing the H2 web console (especially with
# web-allow-others=true) is a security misconfiguration (CWE-16).
# Rotate any credentials that were accessible via this console.
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

vulnerableapp.email.base-url=http://localhost
